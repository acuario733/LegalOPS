name: Deploy staging

on:
  push:
    branches: [main]

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='storage/' \
            --exclude='.git/' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.STAGING_PATH }}/"
      - run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.STAGING_PATH }}' && composer install --no-dev --optimize-autoloader --no-interaction && php scripts/migrate.php up && rm -rf storage/cache/*"
